
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Monster Hill Adventure</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#172033;color:white;font-family:Arial,sans-serif;
  overflow:hidden;touch-action:none;
}
#game{
  display:block;width:100vw;height:100vh;
  background:#87d8ff;
}
#rotateNotice{
  display:none;position:fixed;inset:0;z-index:1000;
  background:linear-gradient(145deg,#171d43,#452b79);
  align-items:center;justify-content:center;text-align:center;
  padding:25px;
}
.rotateBox{max-width:330px}
.phone{
  font-size:75px;display:block;
  animation:turn 1.5s infinite ease-in-out;
}
@keyframes turn{
  0%,100%{transform:rotate(0deg)}
  50%{transform:rotate(90deg)}
}
.rotateBox h2{margin:15px 0;font-size:25px}
.rotateBox p{color:#ddd;line-height:1.5}
@media screen and (orientation:portrait) and (max-width:900px){
  #rotateNotice{display:flex}
  #game,#hud,#controls,#menu{visibility:hidden}
}
#hud{
  position:fixed;top:12px;left:12px;right:12px;
  display:flex;justify-content:space-between;gap:8px;
  pointer-events:none;z-index:5;
}
.stat{
  background:#172033d9;padding:8px 12px;border-radius:12px;
  font-size:13px;font-weight:bold;box-shadow:0 3px 8px #0003;
}
#controls{
  position:fixed;bottom:15px;left:0;right:0;
  display:flex;justify-content:space-between;
  padding:0 18px;z-index:6;pointer-events:none;
}
.controlGroup{display:flex;gap:10px;pointer-events:auto}
.control{
  width:65px;height:65px;border:2px solid #ffffff70;
  border-radius:18px;background:#222d50dd;color:white;
  font-size:25px;font-weight:bold;touch-action:none;
  box-shadow:0 4px 0 #1118;
}
.control:active{transform:translateY(4px);box-shadow:none;background:#7655db}
#menu{
  position:fixed;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  background:#10182b70;text-align:center;padding:20px;
}
.panel{
  width:min(390px,90vw);padding:25px;
  background:linear-gradient(145deg,#292e59,#49327d);
  border:2px solid #ffffff35;border-radius:25px;
  box-shadow:0 15px 40px #0007;
}
.panel h1{font-size:30px;margin-bottom:8px}
.panel p{color:#e3ddff;line-height:1.5;margin:10px 0 18px}
.mainBtn{
  border:0;border-radius:14px;padding:14px 28px;
  background:#ffcf4a;color:#34234c;font-size:17px;
  font-weight:bold;cursor:pointer;
}
#musicBtn{
  position:fixed;right:15px;top:65px;z-index:8;
  border:0;border-radius:12px;padding:9px 12px;
  background:#20294ddd;color:white;font-weight:bold;
}
@media(max-width:600px){
  .control{width:58px;height:58px;font-size:22px}
  .stat{font-size:11px;padding:7px 9px}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="rotateNotice">
  <div class="rotateBox">
    <span class="phone">📱</span>
    <h2>Putar HP Kamu!</h2>
    <p>Game ini dimainkan dalam posisi horizontal (landscape). Silakan miringkan HP agar petualangan dimulai!</p>
  </div>
</div>

<div id="hud">
  <div class="stat">🏆 Skor: <span id="score">0</span></div>
  <div class="stat">🪙 Koin: <span id="coins">0</span></div>
  <div class="stat">💰 Total: <span id="total">0</span></div>
  <div class="stat">📍 <span id="distance">0</span> m</div>
</div>

<button id="musicBtn">🔊 Musik ON</button>

<div id="controls">
  <div class="controlGroup">
    <button class="control" id="brake">◀</button>
    <button class="control" id="gas">▶</button>
  </div>
  <div class="controlGroup">
    <button class="control" id="jump">⬆</button>
  </div>
</div>

<div id="menu">
  <div class="panel">
    <h1 id="menuTitle">🚙 Monster Hill</h1>
    <p id="menuText">Jelajahi bukit, kumpulkan koin dan bensin, serta hindari batu tajam!</p>
    <button class="mainBtn" id="startBtn">MULAI BERMAIN</button>
  </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0,H=0;
function resize(){
  W=canvas.width=innerWidth*devicePixelRatio;
  H=canvas.height=innerHeight*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W=innerWidth;H=innerHeight;
}
addEventListener("resize",resize);
resize();

const $=id=>document.getElementById(id);

let running=false,gameOver=false;
let score=0,runCoins=0,distance=0;
let totalCoins=Number(localStorage.getItem("monsterHillTotalCoins")||0);
let fuel=100,speed=0,world=0;
let objects=[],particles=[];
let lastTime=0,spawnTimer=0;
let audioCtx=null,musicOn=true,musicTimer=null;

const car={
  x:120,y:0,vy:0,angle:0,onGround:true,
  wheel:0
};

let gas=false,brake=false;

function ground(x){
  return H*.72+Math.sin((x+world)*.006)*35+
    Math.sin((x+world)*.013)*13;
}

function startAudio(){
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  if(musicOn&&!musicTimer){
    musicTimer=setInterval(()=>{
      if(!running||!musicOn)return;
      tone(180+Math.random()*100,.07,"sine",.025);
    },500);
  }
}
function tone(freq,duration,type="sine",volume=.08){
  if(!audioCtx||!musicOn)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.value=volume;
  o.connect(g);g.connect(audioCtx.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
  o.stop(audioCtx.currentTime+duration);
}
function sound(freq=500){tone(freq,.13,"sine",.09)}

$("musicBtn").onclick=()=>{
  musicOn=!musicOn;
  $("musicBtn").textContent=musicOn?"🔊 Musik ON":"🔇 Musik OFF";
  if(musicOn)startAudio();
};

function resetGame(){
  score=0;runCoins=0;distance=0;fuel=100;
  speed=0;world=0;objects=[];particles=[];
  car.y=ground(car.x)-42;car.vy=0;car.onGround=true;
  car.angle=0;car.wheel=0;
  spawnTimer=0;gas=false;brake=false;
  gameOver=false;
  updateHUD();
}

function startGame(){
  startAudio();
  resetGame();
  running=true;
  $("menu").style.display="none";
  lastTime=performance.now();
  requestAnimationFrame(loop);
}

$("startBtn").onclick=startGame;

function endGame(){
  running=false;gameOver=true;
  $("menuTitle").textContent="💥 GAME OVER!";
  $("menuText").innerHTML=
    "Skor: "+score+"<br>Koin terkumpul: "+runCoins+
    "<br>Total koin: "+totalCoins;
  $("startBtn").textContent="MAIN LAGI";
  $("menu").style.display="flex";
  sound(100);
}

function updateHUD(){
  $("score").textContent=score;
  $("coins").textContent=runCoins;
  $("total").textContent=totalCoins;
  $("distance").textContent=Math.floor(distance);
}

function jump(){
  if(!running||!car.onGround)return;
  car.vy=-650;
  car.onGround=false;
  sound(600);
}

function bindHold(id,action){
  const el=$(id);
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();el.setPointerCapture(e.pointerId);action(true);
  });
  el.addEventListener("pointerup",e=>{e.preventDefault();action(false)});
  el.addEventListener("pointercancel",()=>action(false));
  el.addEventListener("lostpointercapture",()=>action(false));
}
bindHold("gas",v=>gas=v);
bindHold("brake",v=>brake=v);
$("jump").addEventListener("pointerdown",e=>{e.preventDefault();jump()});

addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowLeft","ArrowUp"," ","a","d","w"].includes(e.key))e.preventDefault();
  if(e.key==="ArrowRight"||e.key==="d")gas=true;
  if(e.key==="ArrowLeft"||e.key==="a")brake=true;
  if(e.key==="ArrowUp"||e.key===" "||e.key==="w")jump();
});
addEventListener("keyup",e=>{
  if(e.key==="ArrowRight"||e.key==="d")gas=false;
  if(e.key==="ArrowLeft"||e.key==="a")brake=false;
});
addEventListener("blur",()=>{gas=false;brake=false});

function spawn(){
  const type=Math.random();
  const x=W+80;
  if(type<.43)objects.push({type:"coin",x,y:ground(x)-90-Math.random()*45});
  else if(type<.62)objects.push({type:"fuel",x,y:ground(x)-55});
  else objects.push({type:"spike",x,y:ground(x)-4});
}

function update(dt){
  if(gas&&fuel>0)speed=Math.min(speed+260*dt,430);
  else speed=Math.max(speed-90*dt,120);
  if(brake)speed=Math.max(70,speed-420*dt);
  if(fuel<=0)speed=Math.max(70,speed-100*dt);

  world+=speed*dt;
  distance+=speed*dt*.025;
  score=Math.floor(distance);

  if(gas&&fuel>0)fuel=Math.max(0,fuel-2.3*dt);

  car.vy+=1450*dt;
  car.y+=car.vy*dt;
  const floor=ground(car.x)-42;
  if(car.y>=floor){
    car.y=floor;car.vy=0;car.onGround=true;
  }else car.onGround=false;

  car.angle=Math.sin(world*.008)*.07;
  car.wheel+=speed*dt*.035;

  spawnTimer-=dt;
  if(spawnTimer<=0){
    spawn();spawnTimer=.85+Math.random()*.65;
  }

  for(let o of objects){
    o.x-=speed*dt;
    if(o.type==="coin"&&Math.abs(o.x-car.x)<34&&Math.abs(o.y-(car.y+15))<48){
      o.type="taken";runCoins++;totalCoins++;
      localStorage.setItem("monsterHillTotalCoins",totalCoins);
      sound(850);
    }
    if(o.type==="fuel"&&Math.abs(o.x-car.x)<38&&Math.abs(o.y-(car.y+15))<45){
      o.type="taken";fuel=Math.min(100,fuel+35);sound(400);
    }
    if(o.type==="spike"&&Math.abs(o.x-car.x)<35){
      const carBottom=car.y+40;
      const spikeTop=o.y-28;
      if(carBottom>spikeTop+5)endGame();
    }
  }
  objects=objects.filter(o=>o.x>-100&&o.type!=="taken");

  updateHUD();
}

function drawBackground(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#70c9ff");sky.addColorStop(1,"#e5f9ff");
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.fillStyle="#fff";
  for(let i=0;i<5;i++){
    let x=(i*260-world*.12)%(W+300);
    if(x< -100)x+=W+300;
    ctx.beginPath();
    ctx.arc(x,90,23,0,Math.PI*2);
    ctx.arc(x+25,80,30,0,Math.PI*2);
    ctx.arc(x+55,95,22,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle="#8abf91";
  ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=8)ctx.lineTo(x,ground(x+world*.5)+40);
  ctx.lineTo(W,H);ctx.fill();

  ctx.fillStyle="#4c9a59";
  ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=8)ctx.lineTo(x,ground(x));
  ctx.lineTo(W,H);ctx.fill();

  ctx.strokeStyle="#286c42";ctx.lineWidth=5;
  ctx.beginPath();
  for(let x=0;x<=W;x+=8){
    let y=ground(x);
    if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
}

function drawCar(){
  ctx.save();
  ctx.translate(car.x,car.y);
  ctx.rotate(car.angle);

  // Bayangan
  ctx.fillStyle="#173d3470";
  ctx.beginPath();ctx.ellipse(0,43,53,9,0,0,Math.PI*2);ctx.fill();

  // Badan mobil
  ctx.fillStyle="#e94d35";
  ctx.beginPath();
  ctx.roundRect(-48,-27,96,42,12);ctx.fill();

  // Kabin
  ctx.fillStyle="#ffb23e";
  ctx.beginPath();
  ctx.moveTo(-23,-27);ctx.lineTo(-12,-52);
  ctx.lineTo(24,-52);ctx.lineTo(39,-27);ctx.closePath();ctx.fill();

  // Kaca
  ctx.fillStyle="#b9edff";
  ctx.beginPath();ctx.moveTo(-8,-47);ctx.lineTo(19,-47);
  ctx.lineTo(29,-29);ctx.lineTo(-16,-29);ctx.closePath();ctx.fill();

  // Lampu
  ctx.fillStyle="#fff3a6";ctx.fillRect(39,-16,9,8);

  // Roda
  for(let x of [-29,30]){
    ctx.fillStyle="#20202b";
    ctx.beginPath();ctx.arc(x,17,17,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#aab3bd";
    ctx.beginPath();ctx.arc(x,17,8,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x,17,12,car.wheel,car.wheel+Math.PI*1.5);ctx.stroke();
  }
  ctx.restore();
}

function drawObjects(){
  for(const o of objects){
    if(o.type==="coin"){
      ctx.fillStyle="#ffce28";ctx.strokeStyle="#c17c08";ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(o.x,o.y,13,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillStyle="#fff3a3";ctx.font="bold 15px Arial";
      ctx.textAlign="center";ctx.fillText("$",o.x,o.y+5);
    }else if(o.type==="fuel"){
      ctx.fillStyle="#e94343";
      ctx.fillRect(o.x-11,o.y-20,22,27);
      ctx.fillStyle="#fff";ctx.fillRect(o.x-6,o.y-15,12,14);
      ctx.fillStyle="#222";ctx.font="bold 11px Arial";
      ctx.textAlign="center";ctx.fillText("F",o.x,o.y-5);
      ctx.fillStyle="#222";ctx.fillRect(o.x-5,o.y-24,10,5);
    }else if(o.type==="spike"){
      ctx.fillStyle="#525563";
      ctx.beginPath();ctx.moveTo(o.x-22,o.y);
      ctx.lineTo(o.x-10,o.y-34);ctx.lineTo(o.x,o.y);
      ctx.lineTo(o.x+12,o.y-34);ctx.lineTo(o.x+25,o.y);
      ctx.closePath();ctx.fill();
      ctx.strokeStyle="#252a35";ctx.lineWidth=3;ctx.stroke();
    }
  }
}

function drawFuel(){
  if(fuel>25)return;
  ctx.fillStyle="#222a";ctx.fillRect(W/2-75,15,150,17);
  ctx.fillStyle="#ff4545";ctx.fillRect(W/2-72,18,144*(fuel/100),11);
  ctx.fillStyle="white";ctx.font="bold 11px Arial";
  ctx.textAlign="center";ctx.fillText("BAHAN BAKAR",W/2,45);
}

function draw(){
  drawBackground();
  drawObjects();
  drawCar();
  drawFuel();

  if(!running&&!gameOver){
    ctx.fillStyle="#172033";ctx.font="bold 18px Arial";
    ctx.textAlign="center";ctx.fillText("Siap berpetualang?",W/2,H*.35);
  }
}

function loop(now){
  if(!running)return;
  const dt=Math.min((now-lastTime)/1000,.035);
  lastTime=now;
  update(dt);
  draw();
  if(running)requestAnimationFrame(loop);
}

totalCoins=Number(localStorage.getItem("monsterHillTotalCoins")||0);
updateHUD();
draw();
</script>
</body>
 </html>
